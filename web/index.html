<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#EAF3F8" />
    <meta name="description" content="Emir CRM — lead management for Dubai and Abu Dhabi off-plan property" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Emir CRM</title>
    <script>
      // Applied before first paint so a stored dark or reduced-glass choice
      // never flashes the light, blurred default. theme.ts owns the keys.
      (function () {
        try {
          var root = document.documentElement;
          var theme = localStorage.getItem('emir.theme');
          if (theme === 'light' || theme === 'dark') root.setAttribute('data-theme', theme);
          if (localStorage.getItem('emir.glass') === 'off') root.setAttribute('data-glass', 'off');
          var dark =
            theme === 'dark' ||
            (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#060D1A' : '#EAF3F8');
        } catch (e) {
          // Blocked storage just means the system preference decides.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
